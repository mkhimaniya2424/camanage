name: ca_desk
description: "CA Desk — Chartered Accountant Management System"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend / cloud
  supabase_flutter: ^2.8.0

  # Environment configuration
  flutter_dotenv: ^5.2.1

  # File/image picking (profile photo, firm logo — Task 4)
  image_picker: ^1.1.2

  # Google Fonts — Inter for body, used via font assets
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
